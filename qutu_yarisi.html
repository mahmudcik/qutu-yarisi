<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Qutu Yarışı</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #111827, #1f2937);
    color: white;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.container {
    width: 100%;
    max-width: 520px;
    padding: 20px;
}

h1 {
    font-size: 32px;
    margin-bottom: 10px;
}

p {
    color: #cbd5e1;
    margin-bottom: 25px;
}

.boxes {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.box {
    aspect-ratio: 1;
    border: none;
    border-radius: 16px;
    background: linear-gradient(145deg, #ef4444, #991b1b);
    color: white;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 8px 18px #0006;
    transition: 0.2s;
}

.box:hover {
    transform: translateY(-4px);
}

.box:active {
    transform: scale(0.96);
}

.box.selected {
    background: linear-gradient(145deg, #22c55e, #15803d);
}

.join {
    margin-top: 25px;
    font-size: 18px;
    font-weight: bold;
}

.info {
    margin-top: 12px;
    color: #cbd5e1;
    font-size: 15px;
}

.result {
    margin-top: 20px;
    min-height: 30px;
    font-size: 21px;
    font-weight: bold;
}

.reset {
    margin-top: 15px;
    padding: 12px 22px;
    border: none;
    border-radius: 12px;
    background: white;
    color: #111827;
    font-weight: bold;
    cursor: pointer;
}

@media (max-width: 420px) {
    h1 {
        font-size: 27px;
    }

    .boxes {
        gap: 7px;
    }

    .box {
        font-size: 23px;
        border-radius: 13px;
    }
}
</style>
</head>

<body>

<div class="container">

    <h1>QUTU YARIŞI</h1>

    <p>1-dən 5-ə qədər bir qutu seç!</p>

    <div class="boxes">

        <button class="box" onclick="chooseBox(1)">🎁1</button>
        <button class="box" onclick="chooseBox(2)">🎁2</button>
        <button class="box" onclick="chooseBox(3)">🎁3</button>
        <button class="box" onclick="chooseBox(4)">🎁4</button>
        <button class="box" onclick="chooseBox(5)">🎁5</button>

    </div>

    <div class="join">
        🌹 5 GÜL AT → YARIŞA QOŞUL
    </div>

    <div class="info">
        İştirakçı qutusunu seçəndə həmin qutuya toxun.<br>
        Hazırıq! 👀
    </div>

    <div id="result" class="result"></div>

    <button class="reset" onclick="resetGame()">Yeni oyun</button>

</div>

<script>

let selected = false;

function chooseBox(number) {

    if (selected) return;

    selected = true;

    document.querySelectorAll(".box")[number - 1]
        .classList.add("selected");

    document.getElementById("result").textContent =
        "🎉 " + number + "-ci qutu seçildi!";
}

function resetGame() {

    selected = false;

    document.querySelectorAll(".box").forEach(function(box) {
        box.classList.remove("selected");
    });

    document.getElementById("result").textContent = "";
}

</script>

</body>
</html>

<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Coins Exchange — DEMO</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#111}
.phone{max-width:430px;min-height:100vh;margin:auto;background:#fff;position:relative;padding:28px 18px 30px}
.demo{position:absolute;top:14px;right:14px;background:#e91e63;color:#fff;padding:6px 12px;border-radius:20px;font-weight:800;font-size:12px}
h1{text-align:center;font-size:22px;margin:18px 0 30px}.label{text-align:center;color:#555;font-size:17px}
.balance{text-align:center;font-size:34px;font-weight:800;margin:8px 0}.sub{text-align:center;color:#777;font-size:14px;margin-bottom:28px}
.coinIcon{display:inline-flex;width:34px;height:34px;border-radius:50%;align-items:center;justify-content:center;
background:linear-gradient(145deg,#ffe89a,#f3b72f);border:2px solid #d99a18;color:#9a6410;
font-size:18px;font-weight:900;vertical-align:middle;box-shadow:0 2px 5px #0002}
.coinIcon.small{width:27px;height:27px;font-size:14px;margin-right:5px}
label{display:block;font-weight:700;margin:15px 0 8px}.input{width:100%;padding:15px;border:1px solid #ddd;border-radius:12px;font-size:17px;outline:none}
.card{margin-top:20px;padding:18px;border:1px solid #ddd;border-radius:18px}.row{display:flex;justify-content:space-between;align-items:center}
.coins{font-size:24px;font-weight:700}.muted{color:#777;font-size:14px}.total{font-size:25px;font-weight:800;margin-top:22px}
button{width:100%;border:0;border-radius:14px;background:#ed174c;color:white;font-size:18px;font-weight:800;padding:16px;margin-top:18px}
.success{display:none;text-align:center;margin-top:16px;padding:14px;border-radius:12px;background:#e9f8ed;color:#16833b;font-weight:800}
.note{text-align:center;color:#888;font-size:12px;margin-top:18px}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:25px}
.modalbox{background:white;border-radius:20px;padding:28px;text-align:center;width:min(360px,100%)}.check{font-size:48px}.modalbox h2{margin:8px 0}
</style>
</head>
<body>
<div class="phone">
<div class="demo">DEMO / MOCKUP</div>
<h1>Coins Exchange</h1>
<div class="label">Demo Coins Balance</div>
<div class="balance"><span id="balance">1,000,000</span> <span class="coinIcon" aria-label="coin">T</span></div>
<div class="sub">Available balance to exchange the Coins</div>

<label>TikTok username</label>
<input id="username" class="input" placeholder="@username">

<div class="card">
  <div class="row"><div><div class="muted">Number of Coins</div><div class="coins"><span class="coinIcon small" aria-label="coin">T</span> <span id="coins">1</span></div></div><div class="muted">All</div></div>
  <input id="amount" class="input" type="number" min="1" value="1" style="margin-top:15px">
  <div class="row" style="margin-top:14px"><span class="muted">Total</span><span class="total">$<span id="total">0.01</span></span></div>
  <button onclick="exchange()">Exchange</button>
  <div id="success" class="success">✓ Successful — Demo exchange completed</div>
</div>
<div class="note">DEMO ONLY — real TikTok Coins are not transferred.</div>
</div>

<div id="modal" class="modal" onclick="this.style.display='none'">
 <div class="modalbox" onclick="event.stopPropagation()">
  <div class="check">✓</div><h2>Successful!</h2>
  <p id="msg">Demo əməliyyatı uğurla tamamlandı.</p>
  <button onclick="document.getElementById('modal').style.display='none'">OK</button>
 </div>
</div>

<script>
const amount=document.getElementById('amount');
const coins=document.getElementById('coins');
const total=document.getElementById('total');
amount.addEventListener('input',()=>{let n=Math.max(1,Number(amount.value)||1);coins.textContent=n.toLocaleString();total.textContent=(n*.01).toFixed(2)});
let balance = 1000000;
function exchange(){
 const u=document.getElementById('username').value.trim()||'@username';
 const n=Math.max(1,Number(amount.value)||1);
 if(n>balance){
   document.getElementById('msg').textContent='Kifayət qədər demo coin yoxdur.';
   document.getElementById('modal').style.display='flex';
   return;
 }
 balance -= n;
 document.getElementById('balance').textContent=balance.toLocaleString();
 document.getElementById('msg').textContent=`${u} üçün ${n.toLocaleString()} demo coin çıxıldı. Qalan balans: ${balance.toLocaleString()} coin.`;
 document.getElementById('success').style.display='block';
 document.getElementById('modal').style.display='flex';
}
</script>
</body>
</html>
